<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selim Y — Projeler</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b6fd8'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='16' text-anchor='middle' fill='white'%3ESY%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1b1f27; --muted: #5d6573;
    --border: #e3e6eb; --accent: #3b6fd8; --accent-soft: #e8effc;
    --off-bg: #f0f1f3; --off-text: #a3a9b3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b2029; --text: #e8ebf0; --muted: #98a1af;
      --border: #2a313d; --accent: #6b97ef; --accent-soft: #22304a;
      --off-bg: #20252e; --off-text: #5c6573;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 48px 16px 64px; }
  header { margin-bottom: 32px; }
  h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px; display: flex; flex-direction: column; gap: 12px;
  }
  .head { display: flex; align-items: center; gap: 12px; }
  .icon {
    width: 44px; height: 44px; border-radius: 11px; flex: none;
    display: grid; place-items: center; color: #fff;
  }
  .icon svg { width: 24px; height: 24px; }
  .name { font-weight: 650; font-size: 17px; }
  .tag {
    display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; margin-left: 6px;
    border-radius: 999px; background: var(--accent-soft); color: var(--accent); vertical-align: 2px;
  }
  .desc { margin: 0; color: var(--muted); font-size: 14px; flex: 1; }
  .links { display: flex; gap: 8px; flex-wrap: wrap; }
  .links a, .links span {
    display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 550;
    padding: 6px 11px; border-radius: 8px; text-decoration: none;
  }
  .links a { background: var(--accent-soft); color: var(--accent); }
  .links a:hover { filter: brightness(0.95); }
  .links span.off { background: var(--off-bg); color: var(--off-text); cursor: not-allowed; }
  .links svg { width: 14px; height: 14px; }
  footer { margin-top: 40px; color: var(--muted); font-size: 13px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Projeler</h1>
    <p>Kişisel web uygulamalarım</p>
  </header>
  <main class="grid" id="grid"></main>
  <footer>selimy.netlify.app</footer>
</div>

<script>
/*
  Proje listesi. Bir adres hazır olduğunda ilgili alanı doldurun;
  boş ("") bırakılan adres sönük ve tıklanamaz görünür.
  netlify: Hub üzerindeki yol (_redirects içindeki kural açık olmalı)
  pages:   GitHub Pages adresi
*/
const PROJECTS = [
  {
    name: "Milestone Tracker v1",
    desc: "Proje kilometre taşlarını zaman çizelgesi üzerinde planlama ve takip aracı.",
    color: "#3b6fd8", icon: "timeline",
    netlify: "/mst/",
    pages: ""
  },
  {
    name: "Milestone Tracker v2", tag: "Çok kullanıcılı",
    desc: "Hesapla giriş ve proje paylaşımı içeren önizleme sürümü (feature/multi-user).",
    color: "#6a55d6", icon: "users",
    netlify: "/mst2/",
    pages: ""
  },
  {
    name: "Investor",
    desc: "Yatırım portföyü takibi; hisse, fon ve döviz fiyatlarıyla getiri hesabı.",
    color: "#1f9d6b", icon: "chart",
    netlify: "",            // hazır olunca: "/investor/"
    pages: "https://selimy.github.io/Investor/investor.html"
  },
  {
    name: "CMAP",
    desc: "Kısa tanım eklenecek.",
    color: "#d9822b", icon: "map",
    netlify: "",            // hazır olunca: "/cmap/"
    pages: "https://selimy.github.io/CMAP/"
  },
  {
    name: "LinkDB",
    desc: "Bağlantı arşivi; her link için not ve ekran görüntüsü saklar.",
    color: "#d64a6a", icon: "link",
    netlify: "",            // hazır olunca: "/linkdb/"
    pages: "https://selimy.github.io/LinkDB/linkDB.html"
  },
  {
    name: "Post Archive",
    desc: "İndirilmiş Instagram gönderilerini arşivleyip görüntüleme aracı.",
    color: "#2a9bb5", icon: "archive",
    netlify: "",            // hazır olunca: "/postarchive/"
    pages: ""
  }
];

const ICONS = {
  timeline: '<path d="M3 12h18M7 12V7M12 12v5M17 12V7"/><circle cx="7" cy="6" r="1.6"/><circle cx="12" cy="18" r="1.6"/><circle cx="17" cy="6" r="1.6"/>',
  users:    '<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3 2.8-4.8 5.5-4.8s4.9 1.8 5.5 4.8"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.3c2.3.2 4 1.8 4.5 4.2"/>',
  chart:    '<path d="M4 19h16"/><path d="M5 15l4-4 3 3 6-7"/><path d="M14 7h4v4"/>',
  map:      '<path d="M9 4 3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/>',
  link:     '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  archive:  '<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"/>'
};
const svg = (inner, w) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w||1.8}" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const NETLIFY_ICON = '<path d="M12 3l9 9-9 9-9-9z"/><path d="M12 8v8M8 12h8"/>';
const GITHUB_ICON  = '<path d="M9 19c-4 1.5-4-2-6-2.5M15 21v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1-.3-3.4 1.3a11.7 11.7 0 0 0-6.2 0C6.6 2.8 5.6 3.1 5.6 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4.2 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/>';

function linkHtml(url, label, icon) {
  return url
    ? `<a href="${url}" target="_blank" rel="noopener">${svg(icon, 2)}${label}</a>`
    : `<span class="off" title="Henüz yayında değil">${svg(icon, 2)}${label}</span>`;
}

document.getElementById("grid").innerHTML = PROJECTS.map(p => `
  <article class="card">
    <div class="head">
      <div class="icon" style="background:${p.color}">${svg(ICONS[p.icon])}</div>
      <div class="name">${p.name}${p.tag ? `<span class="tag">${p.tag}</span>` : ""}</div>
    </div>
    <p class="desc">${p.desc}</p>
    <div class="links">
      ${linkHtml(p.netlify, "Netlify", NETLIFY_ICON)}
      ${linkHtml(p.pages, "GitHub Pages", GITHUB_ICON)}
    </div>
  </article>`).join("");
</script>
</body>
</html>
